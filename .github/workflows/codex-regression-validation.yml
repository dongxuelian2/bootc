name: Focused duplicate-name regression validation
on:
  push:
    branches: [codex/validate-prior-packing-duplicate-names]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bootc-dev/actions/bootc-ubuntu-setup@main
      - name: Install native build dependencies
        run: sudo apt-get install -y libglib2.0-dev libostree-dev libssl-dev libsystemd-dev libzstd-dev libselinux1-dev libclang-dev libfuse3-dev pkg-config ostree skopeo
      - name: Set up Rust and record environment
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          mkdir reports
          { uname -a; cat /etc/os-release; rustc -Vv; cargo -V; systemd-analyze --version; git rev-parse HEAD; printf 'RUSTFLAGS=%s\n' "${RUSTFLAGS-}"; pkg-config --modversion glib-2.0 ostree-1 libsystemd libzstd libselinux; just --list; } | tee reports/environment.log
          { command -v ostree skopeo; ostree --version; skopeo --version; } | tee reports/runtime-tools.log
          git diff --exit-code de7ae55a1c859df999a8d9ccc5eee32372f4c6f0 -- crates/utils/
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bootc-native-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-v2
          restore-keys: bootc-native-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-v1
      - name: Reproduce the discarded prior layout with the old production function
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          p = pathlib.Path('crates/ostree-ext/src/chunking.rs')
          fixed = p.read_text()
          old = subprocess.check_output(['git', 'show', 'fcf896317661495dc7fb50b9df803a3276437601:crates/ostree-ext/src/chunking.rs'], text=True)
          start = 'fn basic_packing_with_prior_build'
          end = '/// Given a set of components with size metadata'
          def function(s):
              a = s.index(start)
              return s[a:s.index(end, a)]
          try:
              p.write_text(fixed.replace(function(fixed), function(old)))
              result = subprocess.run(['cargo', 'test', '-p', 'ostree-ext', '--locked', 'test_prior_packing_duplicate_names', '--', '--nocapture'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              pathlib.Path('reports/baseline.log').write_text(result.stdout)
              print(result.stdout)
              assert result.returncode == 101 and 'duplicate names should preserve the reusable prior layout' in result.stdout
          finally:
              p.write_text(fixed)
          PY
      - name: Run focused chunking tests and project validation
        run: |
          set -o pipefail
          cargo test -p ostree-ext --locked chunking:: -- --nocapture 2>&1 | tee reports/focused.log
          make validate 2>&1 | tee reports/validate.log
      - name: Run every workspace test with Fedora-compatible sh in a private namespace
        if: always()
        run: |
          set -o pipefail
          runner_cargo=$(command -v cargo)
          sudo --preserve-env=PATH,RUSTFLAGS,CARGO_PROFILE_DEV_DEBUG,CARGO_INCREMENTAL,RUST_BACKTRACE \
            unshare --mount --propagation private bash -euc '
              mount --bind /usr/bin/bash "$(readlink -f /bin/sh)"
              /bin/sh --version
              exec sudo -u "$SUDO_USER" --preserve-env=PATH,RUSTFLAGS,CARGO_PROFILE_DEV_DEBUG,CARGO_INCREMENTAL,RUST_BACKTRACE \
                env "PATH=$2" "$1" test --workspace --locked --no-fail-fast -- --test-threads=1
            ' bash "$runner_cargo" "$PATH" 2>&1 | tee reports/workspace.log
      - name: Check final diff
        if: always()
        run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootc-duplicate-names-validation
          path: reports/
      - uses: actions/cache/save@v4
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bootc-native-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-v2
