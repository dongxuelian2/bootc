name: Focused duplicate-name regression validation
on:
  push:
    branches: [codex/validate-prior-packing-duplicate-names]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bootc-dev/actions/bootc-ubuntu-setup@main
      - name: Install native build dependencies
        run: sudo apt-get install -y libglib2.0-dev libostree-dev libssl-dev libsystemd-dev libzstd-dev libselinux1-dev libclang-dev libfuse3-dev pkg-config
      - name: Set up Rust and record environment
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          mkdir reports
          { uname -a; cat /etc/os-release; rustc -Vv; cargo -V; systemd-analyze --version; git rev-parse HEAD; printf 'RUSTFLAGS=%s\n' "${RUSTFLAGS-}"; pkg-config --modversion glib-2.0 ostree-1 libsystemd libzstd libselinux; just --list; } | tee reports/environment.log
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bootc-native-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-v1
      - name: Confirm unchanged shell-dependent test failure
        run: |
          git diff --exit-code de7ae55a1c859df999a8d9ccc5eee32372f4c6f0 -- crates/utils/
          set +e
          cargo test -p bootc-internal-utils --locked command::tests::command_run_capture_stderr -- --exact --nocapture 2>&1 | tee reports/shell-baseline.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" = 101
          grep -F 'test result: FAILED. 0 passed; 1 failed;' reports/shell-baseline.log
      - name: Run every workspace test with Fedora-compatible sh in a private namespace
        if: always()
        run: |
          set -o pipefail
          sudo --preserve-env=PATH,RUSTFLAGS,CARGO_PROFILE_DEV_DEBUG,CARGO_INCREMENTAL,RUST_BACKTRACE \
            unshare --mount --propagation private bash -euc '
              mount --bind /usr/bin/bash "$(readlink -f /bin/sh)"
              /bin/sh --version
              exec sudo -u "$SUDO_USER" --preserve-env=PATH,RUSTFLAGS,CARGO_PROFILE_DEV_DEBUG,CARGO_INCREMENTAL,RUST_BACKTRACE \
                cargo test --workspace --locked --no-fail-fast -- --test-threads=1
            ' 2>&1 | tee reports/workspace.log
      - name: Check final diff
        if: always()
        run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootc-duplicate-names-validation
          path: reports/
      - uses: actions/cache/save@v4
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bootc-native-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-v1
